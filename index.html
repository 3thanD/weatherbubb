<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Bubbles</title>
    <!-- Load Tailwind CSS --><script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Fonts 'Inter' and 'Permanent Marker' --><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <!-- Load Matter.js Physics Engine --><script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    
    <style>
        /* Theme tokens. "Classic" (default) is a dark slate/emerald glass
           theme; "Bon Appel Gold" swaps the accent + sidebar palette to
           match bonappel.com. Both keep a dark sidebar so it never clashes
           with the bubble canvas behind it. */
        :root {
            --wb-body-bg: #111827;
            --wb-accent-from: #a7f3d0;
            --wb-accent-to: #6ee7b7;
            --wb-accent-solid: #34d399;
            --wb-bubble-bg: rgba(255, 255, 255, 0.1);
            --wb-bubble-border: rgba(255, 255, 255, 0.2);
            --wb-topbar-bg: #1f2937;
            --wb-sidebar-from: #1f2937;
            --wb-sidebar-to: #111827;
            --wb-sidebar-text: #e5e7eb;
            --wb-sidebar-heading: #ffffff;
            --wb-sidebar-border: rgba(255, 255, 255, 0.12);
            --wb-input-bg: rgba(255, 255, 255, 0.08);
            --wb-btn-primary: #2563eb;
            --wb-btn-primary-hover: #1d4ed8;
        }
        body.theme-bonappel {
            --wb-body-bg: #09090b;
            --wb-accent-from: #fcd34d;
            --wb-accent-to: #f59e0b;
            --wb-accent-solid: #f59e0b;
            --wb-bubble-bg: rgba(24, 24, 27, 0.55);
            --wb-bubble-border: rgba(245, 158, 11, 0.3);
            --wb-topbar-bg: #000000;
            --wb-sidebar-from: #18181b;
            --wb-sidebar-to: #000000;
            --wb-sidebar-text: #d4d4d8;
            --wb-sidebar-heading: #f4f4f5;
            --wb-sidebar-border: rgba(245, 158, 11, 0.25);
            --wb-input-bg: rgba(245, 158, 11, 0.08);
            --wb-btn-primary: #b45309;
            --wb-btn-primary-hover: #92400e;
        }

        /* Custom styles */
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--wb-body-bg);
            color: white;
            /* Prevent body scrolling when dragging bubbles */
            overflow: hidden;
            /* For custom background */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease-in-out, background-color 0.3s ease;
        }

        /* Glassmorphism bubble style, iOS-inspired frosted glass */
        .bubble {
            position: absolute;
            background: var(--wb-bubble-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--wb-bubble-border);
            border-radius: 1rem; /* rounded-2xl */
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 8px 32px 0 rgba(0, 0, 0, 0.37);

            /* Default size, can be overridden by JS */
            width: 240px;

            /* NEW: Safe minimum sizes */
            min-width: 180px;
            min-height: 150px;

            /* This is now controlled by physics, overflow: hidden is still good */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.3s ease, width 0.2s ease-out, height 0.2s ease-out, opacity 0.3s ease; /* Added opacity */

            /* Center the physics origin */
            transform-origin: center center;

            /* Allow mouse to click "through" to physics body */
            pointer-events: none;

            /* Resize handle is always available -- independent of whether
               the bubble is animating (see the isStatic-gated resize bug
               fix below), so a floating bubble can be resized in place. */
            resize: both;
            opacity: 1; /* Default opacity */
        }
        /* A ~15px native resize handle is a bad touch target and mobile
           bubbles are already sized to the viewport by default (see
           updateResponsiveBubbleDefaults() in the script), so manual
           resize is a desktop-only affordance. */
        @media (max-width: 640px) {
            .bubble { resize: none !important; }
        }
        .bubble.sleeping {
            opacity: 0.6; /* Dim when sleeping */
            box-shadow: none;
        }
        
        /* Make content clickable again */
        .bubble-header, .bubble-content-wrapper {
            pointer-events: auto;
            /* Restore normal text selection inside bubble content -- only
               the empty canvas background (for wind-gust dragging) has it off. */
            user-select: text;
        }

        .bubble:active {
            box-shadow: 0 12px 48px 0 rgba(0, 0, 0, 0.5);
        }

        /* Draggable header for the bubble */
        .bubble-header {
            cursor: grab; /* Still shows move cursor */
            padding: 0.5rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bubble-header:active {
            cursor: grabbing;
        }
        /* NEW: Header buttons container */
        .header-buttons {
            display: flex;
            align-items: center;
            gap: 0.5rem; /* gap-2 */
        }
        /* NEW: Sleep/Wake Button */
        .sleep-wake-btn {
            background: none;
            border: none;
            color: #9ca3af; /* text-gray-400 */
            cursor: pointer;
            padding: 0;
            transition: color 0.2s ease;
        }
        .sleep-wake-btn:hover {
            color: white;
        }
        .sleep-wake-btn svg {
            width: 16px; /* h-4 w-4 */
            height: 16px;
        }


        /* Wrapper for view-switching */
        .bubble-content-wrapper {
            flex-grow: 1;
            position: relative;
            perspective: 1000px;
            border-radius: 0 0 1rem 1rem;
            /* Allow content to scroll if bubble is resized small */
            overflow: auto;
        }

        /* Base class for content views */
        .bubble-content-view {
            width: 100%;
            height: 100%;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px; /* Ensure content area is usable */
        }
        
        /* NEW: Weather Icon SVG */
        .weather-icon-svg {
            width: 4.5rem; /* w-18 */
            height: 4.5rem; /* h-18 */
            margin-top: -0.5rem;
            margin-bottom: -0.5rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }


        /* 7-day forecast view */
        .forecast-view {
            justify-content: flex-start; /* Align to top */
            overflow-y: auto; /* Scroll if content overflows */
        }
        
        /* Close button */
        .close-btn {
            background: rgba(255, 0, 0, 0.5);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .close-btn:hover {
            background: rgba(255, 0, 0, 0.8);
        }
        
        /* Custom non-blocking notification */
        #notification-box {
            transition: opacity 0.5s ease, transform 0.5s ease;
        }


        /* Style for the relocated animation toggle */
        .header-animate-toggle {
            display: flex;
            align-items: center;
            gap: 0.25rem; /* gap-1 */
            font-size: 0.75rem; /* text-xs */
            color: #d1d5db; /* text-gray-300 */
            cursor: pointer;
        }

        /* Simple button for forecast toggle */
        .bubble-btn {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-size: 0.75rem; /* text-xs */
            padding: 0.25rem 0.5rem;
            border-radius: 0.5rem; /* rounded-lg */
            margin-top: 0.5rem; /* mt-2 */
            transition: background 0.2s;
        }
        .bubble-btn:hover {
            background: rgba(0, 0, 0, 0.4);
        }
        
        /* Style for new gravity/zoom sliders */
        .slider-container {
            display: flex;
            align-items: center;
            gap: 0.5rem; /* gap-2 */
            width: 100%; /* Make sliders take full width in sidebar */
            justify-content: space-between;
        }
        .slider-label {
            font-size: 0.875rem; /* text-sm */
            font-weight: 500; /* font-medium */
            color: var(--wb-sidebar-text);
            flex-shrink: 0;
        }
        input[type=range] {
            width: 100%; /* Fill available space */
            height: 0.25rem; /* h-1 */
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 0.5rem; /* rounded-lg */
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--wb-accent-solid);
            cursor: pointer;
        }
        input[type=range]::-moz-range-thumb {
            height: 16px;
            width: 16px;
            border: none;
            border-radius: 50%;
            background: var(--wb-accent-solid);
            cursor: pointer;
        }

        /* Top Bar */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--top-bar-height);
            background-color: var(--wb-topbar-bg);
            /* Above the sidebar (1000) and its overlay (999): position:fixed
               plus z-index makes .top-bar its own stacking context, so
               #menu-toggle-btn's own z-index:1001 only ranked it within
               .top-bar (whose old z-index of 40 lost to the overlay) -- the
               hamburger button was unclickable while the sidebar was open.
               The bar never visually overlaps the sidebar (which starts
               below it), so raising this is safe. */
            z-index: 1002;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            transition: background-color 0.3s ease;
        }
        /* Top Left container for logo and menu */
        .top-left-controls {
             display: flex;
             align-items: center;
             gap: 1rem; /* Space between menu and logo */
             z-index: 60; /* Ensure menu button is clickable */
        }

        /* Main content area (bubble container) */
        #main-content {
            position: fixed;
            top: var(--top-bar-height);
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30; /* Sit below top bar and sidebar */
        }
        
        #bubble-container {
            /* Now relative to main-content */
            position: relative;
            width: 100%;
            height: 100%;
            /* padding-top: var(--control-bar-height-padded); */ /* REMOVED - No top bar padding */
            overflow: hidden; /* FIX: MOVED overflow here */
            /* A wind-gust drag (or any empty-canvas drag) shouldn't select
               page text underneath it. */
            user-select: none;
        }
        
        /* REMOVED #control-bar styles */

        /* WeatherBubb Logo */
        #weatherbubb-logo {
            font-family: 'Permanent Marker', cursive;
            font-size: 2.25rem; /* text-4xl */
            line-height: 1;
            padding: 0.5rem 0; /* Adjusted padding */
            background: linear-gradient(135deg, var(--wb-accent-from), var(--wb-accent-to));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            /* filter: drop-shadow (not text-shadow) respects the clipped/transparent
               fill, avoiding the smeared double-image look text-shadow produces
               on gradient-clipped text. */
            filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.4));
        }
        
        /* NEW: Wrapper for dynamic inputs in sidebar */
         #sidebar .input-wrapper {
             width: 100%; /* Make wrappers take full width */
             justify-content: space-between; /* Space out label/input */
         }
         #sidebar .input-wrapper > label { /* Style for labels if added */
             flex-shrink: 0;
             margin-right: 0.5rem;
             color: var(--wb-sidebar-text);
             opacity: 0.85;
         }
         #sidebar .bubble-input, #sidebar select.bubble-input {
             width: auto; /* Allow inputs to size naturally or expand */
             flex-grow: 1;
             background-color: var(--wb-input-bg);
             color: var(--wb-sidebar-text);
             border-color: var(--wb-sidebar-border);
         }
        
        /* NEW: Shared style for inputs */
        .bubble-input {
            background-color: #4b5563; /* bg-gray-600 */
            border: 1px solid #6b7280; /* border-gray-500 */
            border-radius: 0.375rem; /* rounded-md */
            padding: 0.25rem 0.5rem; /* py-1 px-2 */
            font-size: 0.875rem; /* text-sm */
            color: white;
            placeholder-color: #d1d5db; /* placeholder-gray-300 */
        }
        .bubble-input:focus {
            outline: none;
            border-color: #3b82f6; /* focus:border-blue-500 */
            box-shadow: 0 0 0 2px #3b82f6; /* focus:ring-2 focus:ring-blue-500 */
        }
        
        /* NEW: Specific bubble content styles */
        .sticky-note-content {
            width: 100%;
            height: 100%;
            padding: 0.75rem;
            font-family: 'Inter', sans-serif;
            border: none;
            color: #1f2937; /* text-gray-800 */
            border-radius: 0 0 1rem 1rem;
            resize: none;
        }
        .sticky-note-content:focus {
            outline: none;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }
        
        .calculator-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            width: 100%;
        }
        .calc-btn {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
            padding: 0.25rem 0;
            transition: background 0.2s;
        }
        .calc-btn:hover { background: rgba(0, 0, 0, 0.5); }
        .calc-btn.operator { background: rgba(251, 146, 60, 0.5); } /* orange-400 */
        .calc-btn.operator:hover { background: rgba(251, 146, 60, 0.7); }
        
        .analog-clock-face {
            width: 120px;
            height: 120px;
            border: 3px solid white;
            border-radius: 50%;
            position: relative;
        }
        .clock-hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            background-color: white;
            border-radius: 2px;
        }
        .hour-hand { width: 6px; height: 35px; margin-left: -3px; background-color: #9ca3af; } /* gray-400 */
        .min-hand { width: 4px; height: 50px; margin-left: -2px; }
        .sec-hand { width: 2px; height: 55px; margin-left: -1px; background-color: #ef4444; } /* red-500 */
        .clock-center-dot {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px;
            background-color: #ef4444; /* red-500 */
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        
        .news-list {
            overflow-y: auto;
            width: 100%;
            height: 100%;
            font-size: 0.875rem;
        }
        .news-item {
            display: block;
            padding: 0.25rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #d1d5db; /* text-gray-300 */
            transition: color 0.2s;
            text-decoration: none;
        }
        .news-item:hover { color: white; }

        /* NEW: To-Do List Styles */
        .todo-list-view {
            justify-content: flex-start !important; /* Override center */
            padding: 0.5rem 1rem !important;
        }
        .todo-input-group {
            display: flex;
            width: 100%;
            margin-bottom: 0.5rem;
        }
        .todo-input {
            flex-grow: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 0.5rem 0 0 0.5rem;
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
            color: white;
        }
        .todo-input:focus { outline: none; border-color: #60a5fa; }
        .todo-add-btn {
            background: #3b82f6; /* bg-blue-500 */
            border: 1px solid #2563eb;
            border-radius: 0 0.5rem 0.5rem 0;
            padding: 0.25rem 0.75rem;
            font-weight: bold;
        }
        .todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
            max-height: calc(100% - 30px); /* Adjust for input */
            overflow-y: auto;
        }
        .todo-item {
            display: flex;
            align-items: center;
            padding: 0.3rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .todo-item input[type="checkbox"] {
            margin-right: 0.5rem;
            accent-color: #3b82f6; /* Blue check */
        }
        .todo-item span {
            flex-grow: 1;
            font-size: 0.875rem;
            color: #d1d5db;
            transition: color 0.2s, text-decoration 0.2s;
        }
        .todo-item input:checked + span {
            color: #6b7280; /* Grayed out */
            text-decoration: line-through;
        }
        .todo-delete-btn {
            background: none;
            border: none;
            color: #ef4444; /* red-500 */
            font-size: 1rem;
            cursor: pointer;
            padding: 0 0.25rem;
        }

        /* NEW: World Clock Styles */
        .world-clock-view {
             justify-content: space-around !important;
        }
        .world-clock-city {
            text-align: center;
        }
        .world-clock-time {
            font-size: 1.5rem; /* text-2xl */
            font-weight: bold;
        }
        .world-clock-cityname {
            font-size: 0.875rem; /* text-sm */
            color: #9ca3af; /* text-gray-400 */
        }


        /* NEW: Donation Modal */
        #donation-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 998;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #donation-modal-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #donation-modal {
            background: #1f2937; /* bg-gray-800 */
            border-radius: 1rem;
            padding: 1.5rem;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        #donation-modal-overlay.visible #donation-modal {
            transform: scale(1);
        }
        
        /* NEW: Custom Background Input/Select Wrapper */
        .bg-input-wrapper {
            display: flex;
            align-items: center;
            gap: 0.25rem; /* gap-1 */
             width: 100%; /* Take full width in sidebar */
        }
         #sidebar #custom-bg-select {
             width: auto; /* Adjust width */
             flex-grow: 1;
         }
         #sidebar #custom-bg-input {
             width: auto; /* Adjust width */
             flex-grow: 2; /* Take more space */
         }
         #sidebar #set-bg-btn {
             padding: 0.25rem 0.5rem; /* Match input height */
             flex-shrink: 0;
         }

        
        /* NEW: Clear All Button */
        #clear-all-btn svg {
             width: 1.1rem; /* Slightly larger */
             height: 1.1rem;
        }
        
        /* NEW: Hamburger Button */
        #menu-toggle-btn {
            background: none;
            border: none;
            padding: 0.5rem;
            cursor: pointer;
            z-index: 1001; /* Above overlay */
        }
        #menu-toggle-btn svg {
            width: 24px;
            height: 24px;
            stroke: #e5e7eb; /* gray-200 */
            transition: stroke 0.2s ease;
        }
         #menu-toggle-btn:hover svg {
            stroke: white;
        }

        /* NEW: Sidebar Styles */
        #sidebar {
            position: fixed;
            top: var(--top-bar-height);
            bottom: 0;
            left: 0;
            width: 300px; /* Adjust width as needed */
            max-width: 80%; /* Ensure it doesn't take full screen on mobile */
            background: linear-gradient(to bottom, var(--wb-sidebar-from), var(--wb-sidebar-to));
            color: var(--wb-sidebar-text);
            padding: 1.5rem;
            box-shadow: 4px 0px 15px rgba(0,0,0,0.3);
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out, background 0.3s ease;
            z-index: 1000;
            overflow-y: auto; /* Allow scrolling within sidebar */
            display: flex;
            flex-direction: column;
            gap: 1.5rem; /* Space out sections */
        }
        #sidebar.open {
            transform: translateX(0);
        }
        #sidebar h2 {
            font-size: 1.25rem; /* text-xl */
            font-weight: bold;
            color: var(--wb-sidebar-heading);
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--wb-sidebar-border);
        }
        #sidebar .sidebar-section {
             display: flex;
             flex-direction: column;
             gap: 0.75rem; /* space between items in a section */
        }
        #sidebar button, #sidebar a.button-style {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: background-color 0.2s ease;
            width: 100%; /* Full width buttons */
            text-align: center;
            text-decoration: none;
            color: white; /* Default text color for buttons */
        }
        /* Style specific buttons */
         #sidebar #create-bubble-btn { background-color: var(--wb-btn-primary); }
         #sidebar #create-bubble-btn:hover { background-color: var(--wb-btn-primary-hover); }
         #sidebar #unlock-all-btn { background-color: #0891b2; color: white; } /* bg-cyan-600 */
         #sidebar #unlock-all-btn:hover { background-color: #0e7490; } /* hover:bg-cyan-700 */
         #sidebar #arrange-bubbles-btn { background-color: #7c3aed; color: white; } /* bg-purple-600 */
         #sidebar #arrange-bubbles-btn:hover { background-color: #6d28d9; } /* hover:bg-purple-700 */
         #sidebar #save-layout-btn { background-color: #f59e0b; color: #1f2937; } /* bg-yellow-500 */
         #sidebar #save-layout-btn:hover { background-color: #d97706; } /* hover:bg-yellow-600 */
         #sidebar #load-layout-btn { background-color: #6b7280; color: white; } /* bg-gray-500 */
         #sidebar #load-layout-btn:hover { background-color: #4b5563; } /* hover:bg-gray-600 */
         #sidebar #clear-all-btn { background-color: #dc2626; color: white; } /* bg-red-600 */
         #sidebar #clear-all-btn:hover { background-color: #b91c1c; } /* hover:bg-red-700 */
         #sidebar #donate-btn { background-color: #16a34a; color: white; } /* bg-green-600 */
         #sidebar #donate-btn:hover { background-color: #15803d; } /* hover:bg-green-700 */
         #sidebar #load-preset-btn { background-color: #0d9488; color: white; } /* bg-teal-600 */
         #sidebar #load-preset-btn:hover { background-color: #0f766e; } /* hover:bg-teal-700 */

        /* Soap-bubble "boop": a brief brightness pulse on collision. Kept off
           the transform property since the physics render loop drives
           .bubble's transform every frame -- animating a different property
           avoids fighting that. */
        @keyframes bubble-collide-pulse {
            0% { filter: brightness(1); }
            35% { filter: brightness(1.4); }
            100% { filter: brightness(1); }
        }
        .bubble-collide {

        let bubbleResizeObserver;
        // Global "float speed": lower frictionAir = looser/faster drifting bubbles.
        // Driven by the Float Speed slider (1 = sluggish, 10 = floaty/fast).
        let currentFrictionAir = 0.035;
        function speedToFrictionAir(speed) {
            return 0.065 - (speed * 0.006);
        }
        
        // Bubble size constraints & defaults -- recomputed per viewport by
        // updateResponsiveBubbleDefaults() (called from updateLayoutCSS(),
        // which already runs on load and on window resize). A fixed 240px
        // default meant two bubbles never fit side by side on a phone --
        // they'd overlap and clip each other. Mobile gets a near-full-width
        // default so bubbles naturally stack one per row instead.
        const MOBILE_BREAKPOINT = 640; // px
        let BUBBLE_MIN_WIDTH = 180;
        let BUBBLE_MIN_HEIGHT = 150;
        let BUBBLE_DEFAULT_WIDTH = 240;
        let BUBBLE_DEFAULT_HEIGHT = 220;
        let BUBBLE_NEWS_HEIGHT = 360; // Larger height for feeds
        let BUBBLE_TODO_HEIGHT = 300; // Height for ToDo List
        let isMobileViewport = false;

        function updateResponsiveBubbleDefaults() {
            isMobileViewport = window.innerWidth < MOBILE_BREAKPOINT;
            if (isMobileViewport) {
                // Near-full width (minus a little breathing room on each side)
                BUBBLE_DEFAULT_WIDTH = Math.round(Math.max(220, window.innerWidth - 32));
                BUBBLE_MIN_WIDTH = Math.round(Math.max(180, window.innerWidth - 48));
            } else {
                // Gently scale with viewport width instead of one fixed
                // number, so a small laptop and an ultrawide monitor don't
                // get identically-sized bubbles.
                BUBBLE_DEFAULT_WIDTH = Math.min(300, Math.max(220, Math.round(window.innerWidth / 6)));
                BUBBLE_MIN_WIDTH = 180;
            }
            BUBBLE_DEFAULT_HEIGHT = Math.round(BUBBLE_DEFAULT_WIDTH * (220 / 240)); // keep the original aspect ratio
            BUBBLE_MIN_HEIGHT = isMobileViewport ? Math.round(BUBBLE_MIN_WIDTH * (150 / 180)) : 150;
            BUBBLE_NEWS_HEIGHT = BUBBLE_DEFAULT_HEIGHT + 140;
            BUBBLE_TODO_HEIGHT = BUBBLE_DEFAULT_HEIGHT + 80;
        }

             bubbleContainer.style.paddingTop = `0px`; // No top padding needed now

        // --- Notification Function ---
        function showNotification(message, type = 'info') {
            if (notificationTimeout) clearTimeout(notificationTimeout);
            notificationMessage.textContent = message;
            notificationBox.classList.remove('bg-red-600', 'bg-green-600', 'bg-blue-600', 'hidden', 'opacity-0', '-translate-y-20');
            
            if (type === 'error') notificationBox.classList.add('bg-red-600');
            else if (type ==='success') notificationBox.classList.add('bg-green-600');
            else notificationBox.classList.add('bg-blue-600');
            
            notificationBox.classList.add('opacity-100', 'translate-y-0');
            notificationTimeout = setTimeout(() => {
                notificationBox.classList.remove('opacity-100', 'translate-y-0');
                notificationBox.classList.add('opacity-0', '-translate-y-20');
                setTimeout(() => notificationBox.classList.add('hidden'), 500);
            }, 3000);
        }

        // --- Shared CORS-proxy fetch with fallback ---
        // Several free public APIs used below (Yahoo Finance, ZenQuotes) don't
        // send CORS headers, so they're routed through a keyless proxy. Two
        // proxies are tried in order so a single proxy having a bad day (or a
        // stale cached error for one specific query, e.g. one stock ticker)
        // doesn't take down the whole feature.
        async function fetchViaProxy(targetUrl) {
            const proxyBuilders = [
                (u) => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
                (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
            ];
            let lastError;
            for (const buildProxyUrl of proxyBuilders) {
                try {
                    const response = await fetch(buildProxyUrl(targetUrl));
                    if (!response.ok) throw new Error(`Proxy HTTP ${response.status}`);
                    const text = await response.text();
                    // allorigins wraps the target response as {contents: "..."};
                    // corsproxy.io passes it through raw. Unwrap only if it
                    // actually looks like the allorigins envelope.
                    try {
                        const asJson = JSON.parse(text);
                        if (asJson && typeof asJson.contents === 'string') return asJson.contents;
                    } catch { /* not JSON, or not the allorigins shape -- use raw text below */ }
                    return text;
                } catch (e) {
                    lastError = e;
                    console.warn('Proxy failed, trying next:', e.message);
                }
            }
            throw lastError || new Error('All CORS proxies failed.');
        }

        // --- Joke Generator (API-based, used by the Joke bubble) ---
        async function fetchJokeBatch(category, count) {
            const cat = category || 'Any';
            const amount = Math.max(1, Math.min(5, count || 3));
            try {
                const response = await fetch(`https://v2.jokeapi.dev/joke/${cat}?safe-mode&type=single&amount=${amount}`);
                if (!response.ok) throw new Error('Joke API network error');
                const data = await response.json();
                if (data.error) throw new Error(data.message || 'Joke API error');
                // amount=1 returns a single joke object; amount>1 returns { jokes: [...] }
                if (Array.isArray(data.jokes)) return data.jokes.map(j => j.joke);
                if (data.joke) return [data.joke];
                return ["No jokes found for that topic -- try a different one."];
            } catch (e) {
                console.error("Failed to fetch jokes:", e);
                return ["Why don't bubbles play hide and seek? They always pop up!"];
            }
        }


        // --- API & Data Functions ---
        
        // Weather
        function mapWeatherCode(code) {
             // Maps Open-Meteo codes to icon names AND generates descriptions
             const iconMap = {
                 0: "sun", 1: "sun-cloud",
                 2: "cloud", 3: "cloud",
                 45: "cloud-fog", 48: "cloud-fog",
                 51: "cloud-drizzle", 53: "cloud-drizzle", 55: "cloud-drizzle",
                 61: "cloud-rain", 63: "cloud-rain", 65: "cloud-rain-heavy",
                 66: "cloud-sleet", 67: "cloud-sleet",
                 71: "cloud-snow", 73: "cloud-snow", 75: "cloud-snow-heavy", 77: "cloud-snow",
                 80: "cloud-rain", 81: "cloud-rain-heavy", 82: "cloud-rain-heavy",
                 85: "cloud-snow", 86: "cloud-snow-heavy",
                 95: "cloud-lightning", 96: "cloud-lightning", 99: "cloud-lightning",
             };
             const descriptionMap = {
                 0: "Clear Sky", 1: "Mainly Clear", 2: "Partly Cloudy", 3: "Overcast",
                 45: "Fog", 48: "Rime Fog",
                 51: "Light Drizzle", 53: "Moderate Drizzle", 55: "Dense Drizzle",
                 61: "Slight Rain", 63: "Moderate Rain", 65: "Heavy Rain",
                 66: "Light Freezing Rain", 67: "Heavy Freezing Rain",
                 71: "Slight Snow Fall", 73: "Moderate Snow Fall", 75: "Heavy Snow Fall", 77: "Snow Grains",
                 80: "Slight Rain Showers", 81: "Moderate Rain Showers", 82: "Violent Rain Showers",
                 85: "Slight Snow Showers", 86: "Heavy Snow Showers",
                 95: "Thunderstorm", 96: "Thunderstorm + Sleet", 99: "Thunderstorm + Hail",
             };

             const iconName = iconMap[code] || "cloud"; // Default icon
             const description = descriptionMap[code] || "Weather"; // Default description

             return { description, icon: iconName };
        }
        async function getWeatherData(zip) {
            const geoResponse = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${zip}&count=1&language=en&format=json`);
            const geoData = await geoResponse.json();
            if (!geoResponse.ok || !geoData.results) throw new Error("Zip code not found.");
            const location = geoData.results[0];
            const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto`;
            const weatherResponse = await fetch(weatherUrl);
            if (!weatherResponse.ok) throw new Error("Could not fetch weather.");
            const weatherData = await weatherResponse.json();
            return { weatherData, locationName: location.name };
        }

        // Stock (real quotes via Yahoo Finance's public chart endpoint, routed
        // through fetchViaProxy's proxy-with-fallback chain -- no API key
        // required, keeping keys out of this fully client-side app entirely)
        async function getStockData(ticker) {
            // Cache-bust: a CORS proxy can cache a transient upstream error
            // (e.g. one bad response for one ticker) and keep serving it.
            const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?_=${Date.now()}`;

            let raw;
            try {
                raw = await fetchViaProxy(url);
            } catch (e) {
                throw new Error("Could not fetch stock data (proxy error).");
            }

            let data;
            try {
                data = JSON.parse(raw);
            } catch (e) {
                console.error("Failed to parse stock API response:", raw);
                throw new Error("Stock API returned invalid data.");
            }

            if (data?.chart?.error) {
                console.error("Stock API returned an error for", ticker, data.chart.error);
                throw new Error(`Could not find quote for "${ticker}": ${data.chart.error.description || 'unknown symbol.'}`);
            }

            const meta = data?.chart?.result?.[0]?.meta;
            if (!meta || typeof meta.regularMarketPrice !== 'number') {
                console.error("Stock API failed, response:", data);
                throw new Error(`Could not find quote for "${ticker}". Check the ticker symbol.`);
            }

            const price = meta.regularMarketPrice;
            const previousClose = meta.previousClose ?? meta.chartPreviousClose ?? price;
            const change = price - previousClose;
            const changePercent = previousClose ? (change / previousClose) * 100 : 0;

            return {
                ticker: meta.symbol || ticker,
                price: price.toFixed(2),
                change: change.toFixed(2),
                changePercent: changePercent.toFixed(2),
            };
        }
        
        // News (via rss2json proxy)
        async function getNewsData(topic) {
            const feeds = {
                world: 'https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en&topic=w',
                business: 'https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en&topic=b',
                technology: 'https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en&topic=t',

                science: 'https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en&topic=s'
            };
            const rssUrl = feeds[topic] || feeds.world;
            const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`);
            if (!response.ok) throw new Error("Could not fetch news.");
            const data = await response.json();
            if (data.status !== 'ok') throw new Error("News feed failed.");
            return data.items.slice(0, 10); // Get top 10 articles
        }

        async function getRedditData(subreddit) {

        // --- Physics Engine Setup ---
        
        function initPhysics() {
            matterEngine = Engine.create();
            matterWorld = matterEngine.world;
            matterWorld.gravity.y = parseFloat(gravitySlider.value); 
            
            updateWalls();
            
            const mouse = Mouse.create(mainContent);
            matterMouseConstraint = MouseConstraint.create(matterEngine, {
                mouse: mouse,
                constraint: { stiffness: 0.2, render: { visible: false } }
            });
            Composite.add(matterWorld, matterMouseConstraint);
            
            matterRunner = Runner.create();
            Runner.run(matterRunner, matterEngine);
            
            (function render() {
                const bodies = Composite.allBodies(matterWorld);
                for (const body of bodies) {
                    const domElement = bubbleMap.get(body.id);
                    if (domElement) {
                        Body.setAngle(body, 0); // Keep bubble upright
                        const { x, y } = body.position;
                        // Read size from body, not DOM
                        const w = body.customWidth;
                        const h = body.customHeight;
                        domElement.style.transform = `translate(${x - w / 2}px, ${y - h / 2}px)`; // No rotation
                    }
                }
                requestAnimationFrame(render);
            })();

            // NEW: Resize Observer
            bubbleResizeObserver = new ResizeObserver(entries => {
                for (let entry of entries) {
                    const bubble = entry.target;
                    const bodyId = reverseBubbleMap.get(bubble);
                    if (!bodyId) continue;
                    
                    const body = Composite.get(matterWorld, bodyId, 'body');
                    // Resize handle works regardless of whether the bubble is
                    // animating -- it used to require Animate to be unchecked
                    // (isStatic) first, which made resizing a floating bubble
                    // impossible without freezing it.
                    if (body) {
                        // Enforce min size
                        const newWidth = Math.max(BUBBLE_MIN_WIDTH * currentScale, entry.contentRect.width); // Scale min size too
                        const newHeight = Math.max(BUBBLE_MIN_HEIGHT * currentScale, entry.contentRect.height);
                        
                        // Calculate scale from *current* physics body size
                        const oldWidth = body.customWidth;
                        const oldHeight = body.customHeight;
                        
                        const scaleX = newWidth / oldWidth;
                        const scaleY = newHeight / oldHeight;

                        if (Math.abs(scaleX - 1) > 0.01 || Math.abs(scaleY - 1) > 0.01) {
                            // Update DOM size first to match visual drag
                             bubble.style.width = `${newWidth}px`;
                             bubble.style.height = `${newHeight}px`;

                            // Scale physics body
                            Body.scale(body, scaleX, scaleY);
                            // IMPORTANT: Update position because scaling changes the center
                            Body.setPosition(body, {
                                x: body.position.x + (newWidth - oldWidth) / 2,
                                y: body.position.y + (newHeight - oldHeight) / 2
                            });
                            
                            body.customWidth = newWidth;
                            body.customHeight = newHeight;
                            
                            // Save new size
                            try {
                                const bubbleData = JSON.parse(bubble.dataset.bubbleData);
                                bubbleData.width = newWidth;
                                bubbleData.height = newHeight;
                                bubble.dataset.bubbleData = JSON.stringify(bubbleData);
                                // No immediate save here, rely on Save Layout btn or close
                            } catch (e) { console.error("Error saving bubble resize:", e); }
                        }
                    }
                }
            });
            
            window.addEventListener('resize', () => {
                updateLayoutCSS();
                updateWalls();
            });

            initWindGust();

            // Soap-bubble "boop" on collision between two bubbles
            Events.on(matterEngine, 'collisionStart', (event) => {
                event.pairs.forEach(pair => {
                    [pair.bodyA, pair.bodyB].forEach(body => {
                        const el = bubbleMap.get(body.id);
                        if (!el) return; // Not a bubble (e.g. a wall)
                        el.classList.remove('bubble-collide');
                        void el.offsetWidth; // Force reflow so the animation can re-trigger
                        el.classList.add('bubble-collide');
                    });
                });
            });
        }

        // --- Wind Gust: click-drag on empty canvas to shove floating bubbles ---
        let gustStart = null;
        let gustLineEl = null;

        function isPointOnABubble(clientX, clientY) {
            const rect = bubbleContainer.getBoundingClientRect();
            const point = { x: clientX - rect.left, y: clientY - rect.top };
            const bodies = Composite.allBodies(matterWorld).filter(b => bubbleMap.has(b.id));
            return Query.point(bodies, point).length > 0;
        }

        function updateGustLine(start, end) {
            const dx = end.x - start.x;
            const dy = end.y - start.y;
            const length = Math.hypot(dx, dy);
            const angle = Math.atan2(dy, dx) * 180 / Math.PI;
            gustLineEl.style.width = `${length}px`;
            gustLineEl.style.left = `${start.x}px`;
            gustLineEl.style.top = `${start.y}px`;
            gustLineEl.style.transform = `rotate(${angle}deg)`;
        }

        function applyWindGust(start, end) {
            const dx = end.x - start.x;
            const dy = end.y - start.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 20) return; // Ignore taps / tiny drags

            const dirX = dx / dist;
            const dirY = dy / dist;
            const strength = Math.min(dist, 400) * 0.0006; // Clamp so huge drags don't launch bubbles offscreen

            let affected = 0;
            Composite.allBodies(matterWorld).forEach(body => {
                if (!bubbleMap.has(body.id)) return; // Skip walls
                if (body.isStatic) return; // Locked/sleeping bubbles are unaffected
                Body.applyForce(body, body.position, { x: dirX * strength, y: dirY * strength });
                affected++;
            });
            if (affected > 0) showNotification("Gust!", "info");
        }

        function initWindGust() {
            bubbleContainer.addEventListener('pointerdown', (e) => {
                if (e.button !== undefined && e.button !== 0) return; // Left click / primary touch only
                if (e.target.closest('.bubble')) return; // Clicked an interactive bubble child
                if (isPointOnABubble(e.clientX, e.clientY)) return; // Clicked a bubble's (pass-through) body area
                e.preventDefault(); // Stop the drag from selecting page text
                gustStart = { x: e.clientX, y: e.clientY };
                gustLineEl = document.createElement('div');
                gustLineEl.className = 'wind-gust-line';
                document.body.appendChild(gustLineEl);
                updateGustLine(gustStart, gustStart);
            });
            window.addEventListener('pointermove', (e) => {
                if (!gustStart || !gustLineEl) return;
                updateGustLine(gustStart, { x: e.clientX, y: e.clientY });
            });
            window.addEventListener('pointerup', (e) => {
                if (!gustStart) return;
                applyWindGust(gustStart, { x: e.clientX, y: e.clientY });
                gustStart = null;
                if (gustLineEl) { gustLineEl.remove(); gustLineEl = null; }
            });
        }

        function updateWalls() {
            Composite.remove(matterWorld, walls);
            const w = contentWidth;
            const wallThickness = 60; // Increased thickness for reliability
             // FIX: Top boundary is now 0 (top of bubble container)
            const h = contentHeight; // Full height of the container
            const wallOptions = { isStatic: true, restitution: 0.3, friction: 0.1 }; // Reduced restitution

            walls = [
                 // Top wall (thin line at y=0)
                 Bodies.rectangle(w / 2, -wallThickness / 2, w + wallThickness * 2, wallThickness, wallOptions),
                 // Bottom wall (at bottom of container height)
                 Bodies.rectangle(w / 2, h + wallThickness / 2, w + wallThickness * 2, wallThickness, wallOptions),
                 // Left wall
                 Bodies.rectangle(-wallThickness / 2, h / 2, wallThickness, h + wallThickness, wallOptions),
                 // Right wall
                 Bodies.rectangle(w + wallThickness / 2, h / 2, wallThickness, h + wallThickness, wallOptions)
            ];
            
            Composite.add(matterWorld, walls);
        }

             const mappedWeather = mapWeatherCode(current.weathercode);

                const dayIconName = mapWeatherCode(daily.weathercode[i]).icon; // Get icon name

        function buildCountdownBubble(bubble, contentWrapper, data) {
            const { name, date } = data;
            const targetDate = new Date(date + "T00:00:00").getTime();
            
            contentWrapper.innerHTML = `
                <div class="bubble-content-view text-center">
                    <h3 class="text-lg font-bold">${name}</h3>
                    <p class="time-remaining text-3xl font-bold my-1"></p>
                    <p class="target-date text-sm text-gray-300"></p>
                </div>
            `;
            const timeEl = contentWrapper.querySelector('.time-remaining');
            const dateEl = contentWrapper.querySelector('.target-date');
            dateEl.textContent = new Date(date + "T00:00:00").toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            
            function updateCountdown() {
                 if (bubble.isSleeping) return; // NEW: Don't update if sleeping
                const now = new Date().getTime();
                const distance = targetDate - now;
                
                if (distance < 0) {
                    timeEl.textContent = "Finished!";
                    clearInterval(bubble.intervalId);
                    return;
                }
                
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                
                if (days > 0) timeEl.textContent = `${days}d ${hours}h ${minutes}m`;
                else timeEl.textContent = `${hours}h ${minutes}m ${seconds}s`;
            }
            updateCountdown();
            bubble.intervalId = setInterval(updateCountdown, 1000);
        }

        function buildTimerBubble(bubble, contentWrapper, data) {
            let totalSeconds = (data.minutes || 0) * 60;
            let timerRunning = false;
            
            contentWrapper.innerHTML = `
                <div class="bubble-content-view text-center">
                    <p class="timer-display text-5xl font-bold">${formatTime(totalSeconds)}</p>
                    <div class="flex gap-2 mt-2">
                        <button class="timer-start-stop bubble-btn w-16">${totalSeconds > 0 ? "Start" : "Reset"}</button>
                        <button class="timer-reset bubble-btn w-16">Reset</button>
                    </div>
                </div>
            `;
            
            const displayEl = contentWrapper.querySelector('.timer-display');
            const startStopBtn = contentWrapper.querySelector('.timer-start-stop');
            const resetBtn = contentWrapper.querySelector('.timer-reset');

            function formatTime(sec) {
                const minutes = Math.floor(sec / 60);
                const seconds = sec % 60;
                return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            }

            function tick() {
                if (!timerRunning || bubble.isSleeping) return; // Check sleep state
                if (totalSeconds <= 0) {
                    clearInterval(bubble.intervalId);
                    bubble.intervalId = null; // Clear intervalId
                    timerRunning = false;
                    startStopBtn.textContent = "Done!";
                } else {
                    totalSeconds--;
                    displayEl.textContent = formatTime(totalSeconds);
                }
            }

            startStopBtn.addEventListener('click', () => {
                 if (bubble.isSleeping) return; // Ignore clicks if sleeping
                if (totalSeconds <= 0 && !timerRunning) return; // Don't start a finished timer
                timerRunning = !timerRunning;
                startStopBtn.textContent = timerRunning ? "Pause" : "Start";
                if (timerRunning && !bubble.intervalId) {
                    bubble.intervalId = setInterval(tick, 1000);
                }
            });
            
            resetBtn.addEventListener('click', () => {
                 if (bubble.isSleeping) return; // Ignore clicks if sleeping
                clearInterval(bubble.intervalId);
                bubble.intervalId = null;
                timerRunning = false;
                totalSeconds = (data.minutes || 0) * 60;
                displayEl.textContent = formatTime(totalSeconds);
                startStopBtn.textContent = "Start";
            });
        }

            `;

                 if (contentWrapper.closest('.bubble').isSleeping) return; // Ignore clicks if sleeping

                const key = e.target.textContent;
                
                if (key === 'AC') {
                    display.value = '';
                } else if (key === '=') {
                    try {
                        // Basic safety eval
                        let result = eval(display.value.replace(/[^-+\/*%.0-9]/g, ''));
                        display.value = parseFloat(result.toFixed(5));
                    } catch {
                        display.value = 'Error';
                    }
                } else if (key === '&larr;') {
                    display.value = display.value.slice(0, -1);
                } else if (key === '%') {
                    try {
                        display.value = parseFloat(eval(display.value) / 100);
                    } catch { /* ignore */ }
                } else {
                    display.value += key;
                }
            });
        }

            const refreshBtn = contentWrapper.querySelector('.joke-refresh-btn');

            function render() {
                textEl.textContent = data.jokes[data.jokeIndex] || '...';
                counterEl.textContent = `${data.jokeIndex + 1} / ${data.jokes.length}`;
            }
            function persist() {
                const bubbleData = JSON.parse(bubble.dataset.bubbleData);
                bubbleData.jokes = data.jokes;
                bubbleData.jokeIndex = data.jokeIndex;
                bubbleData.category = data.category;
                bubbleData.count = data.count;
                bubble.dataset.bubbleData = JSON.stringify(bubbleData);
                saveBubblesState();
            }

            prevBtn.addEventListener('click', () => {
                if (bubble.isSleeping) return;
                data.jokeIndex = (data.jokeIndex - 1 + data.jokes.length) % data.jokes.length;
                render(); persist();
            });
            nextBtn.addEventListener('click', () => {
                if (bubble.isSleeping) return;
                data.jokeIndex = (data.jokeIndex + 1) % data.jokes.length;
                render(); persist();
            });
            refreshBtn.addEventListener('click', async () => {
                if (bubble.isSleeping) return;
                refreshBtn.disabled = true;
                refreshBtn.textContent = 'Loading...';
                data.jokes = await fetchJokeBatch(data.category, data.count);
                data.jokeIndex = 0;
                render(); persist();
                refreshBtn.disabled = false;
                refreshBtn.textContent = 'New Jokes';
            });

            render();

            // Freshly-created bubble (not restored from a save) -- fetch its first batch now
            if (!data._jokesLoaded) {
                data._jokesLoaded = true;
                fetchJokeBatch(data.category, data.count).then(jokes => {
                    data.jokes = jokes;
                    data.jokeIndex = 0;
                    render(); persist();
                });
            }
        }

        async function createAndDisplayBubble(type, data) {
            let apiData;
            
            // 1. Get API data based on type
            try {
                switch (type) {
                    case 'weather': apiData = await getWeatherData(data.zip); break;
                    case 'stock': apiData = await getStockData(data.ticker); break;
                    case 'news': apiData = await getNewsData(data.topic); break;
                    case 'reddit': apiData = await getRedditData(data.subreddit); break;
                    case 'crypto': apiData = await getCryptoData(data.coinId); break;
                    case 'quote': apiData = await getQuoteData(data.tag); break;
                    default: apiData = data; // For bubbles with no API
                }
            } catch (error) {
                console.error("API Error:", error);
                // Don't throw here, allow bubble creation with error state if possible
                 showNotification(error.message, "error");
                 // For some bubble types, we might still want to create it.
                 // 'stock' was missing from this list, which was a real bug:
                 // any transient hiccup fetching a quote (e.g. a proxy having
                 // a bad moment for one specific ticker) meant the bubble
                 // never appeared at all -- not even an error state -- just a
                 // toast that fades in 3s. That reads exactly like "this
                 // ticker doesn't load" even though other tickers work fine
                 // moments later.
                 if (type === 'weather' || type === 'news' || type === 'reddit' || type === 'crypto' || type === 'quote' || type === 'stock') {
                     apiData = { error: true, message: error.message }; // Pass error state
                 } else {
                    throw error; // Stop bubble creation for others
                 }
            }
            
            // 2. Build shell
            const { bubble, contentWrapper } = await buildBubbleShell(data);
            
            // 3. Store data on the bubble for saving
            data.type = type;
            const zoom = parseFloat(zoomSlider.value);
            
             // Determine default height based on type
             let defaultHeight = BUBBLE_DEFAULT_HEIGHT;
             if (type === 'news' || type === 'reddit') defaultHeight = BUBBLE_NEWS_HEIGHT;
             if (type === 'todo') defaultHeight = BUBBLE_TODO_HEIGHT;
             
             // Apply size. On mobile, always use the current responsive
             // default and ignore any saved/legacy width -- a bubble saved
             // (or hand-resized) at a desktop size would otherwise still be
             // technically narrower than the phone's viewport on its own,
             // but too small relative to the new mobile default to force a
             // clean single-column layout, so physics still clusters
             // several of them together looking exactly as cramped as
             // before. Manual resize is a desktop-only affordance (see the
             // mobile media query), so there's nothing to preserve here.
             if (isMobileViewport) {
                 data.width = BUBBLE_DEFAULT_WIDTH * zoom;
                 data.height = defaultHeight * zoom;
             } else {
                 data.width = data.width || (BUBBLE_DEFAULT_WIDTH * zoom);
                 data.height = data.height || (defaultHeight * zoom);
             }

            // Clamp loaded sizes AFTER applying zoom factor potentially
            data.width = Math.max(BUBBLE_MIN_WIDTH * zoom, data.width);
            data.height = Math.max(BUBBLE_MIN_HEIGHT * zoom, data.height);

            // Never let a bubble -- freshly created, loaded from a save, or
            // previously hand-resized -- be wider than the viewport. Without
            // this, a layout saved (or resized) on a wide desktop window
            // opens on a phone with bubbles wider than the screen, so two
            // side by side overlap and clip each other's text.
            const viewportMaxWidth = contentWidth - 16;
            if (data.width > viewportMaxWidth) {
                const shrink = viewportMaxWidth / data.width;
                data.width = Math.round(viewportMaxWidth);
                data.height = Math.round(data.height * shrink);
            }


             data.isStatic = data.isStatic === undefined ? false : data.isStatic; // Default to dynamic/draggable
            data.isSleeping = data.isSleeping || false; // NEW: Save sleep state
            bubble.isSleeping = data.isSleeping; // Store on DOM element for quick access
            bubble.dataset.bubbleData = JSON.stringify(data);
            
            // Apply size to DOM element
            bubble.style.width = `${data.width}px`;
            bubble.style.height = `${data.height}px`;
            
            // 4. Build the specific bubble content
             // Handle potential API errors passed via apiData
             if (apiData && apiData.error) {
                 contentWrapper.innerHTML = `<div class="bubble-content-view text-red-400">Error: ${apiData.message}</div>`;
             } else {
                 switch (type) {
                    case 'weather': buildWeatherBubble(contentWrapper, apiData); break;
                    case 'stock': buildStockBubble(contentWrapper, apiData); break;
                    case 'news': buildNewsBubble(contentWrapper, apiData); break;
                    case 'reddit': buildRedditBubble(contentWrapper, apiData, data); break;
                    case 'crypto': buildCryptoBubble(contentWrapper, apiData, data); break;
                    case 'quote': buildQuoteBubble(contentWrapper, apiData); break;
                    case 'digitalClock': buildDigitalClockBubble(bubble, contentWrapper, data); break;
                    case 'analogClock': buildAnalogClockBubble(bubble, contentWrapper); break;
                    case 'countdown': buildCountdownBubble(bubble, contentWrapper, data); break;
                    case 'timer': buildTimerBubble(bubble, contentWrapper, data); break;
                    case 'note': buildNoteBubble(contentWrapper, data); break;
                    case 'calculator': buildCalculatorBubble(contentWrapper); break;
                    case 'image': buildImageBubble(contentWrapper, data); break;
                    case 'todo': buildTodoBubble(contentWrapper, data); break; // NEW
                    case 'worldClock': buildWorldClockBubble(bubble, contentWrapper, data); break; // NEW
                    case 'joke': buildJokeBubble(bubble, contentWrapper, data); break;
                }
             }

            
            // 5. Create physics body
            const width = data.width;
            const height = data.height;
            // Spawn lower down & check bounds
            const spawnPadding = 30; // Min distance from edges/top
            let x = Math.max(width/2 + spawnPadding, Math.min(contentWidth - width/2 - spawnPadding, contentWidth / 2 + (Math.random() * 50 - 25)));
             // FIX: Calculate top boundary based on current menu state's padding
             const topBoundaryPadding = parseFloat(bubbleContainer.style.paddingTop) || 0; 
             let yTopBoundary = topBoundaryPadding + height / 2 + spawnPadding;
             let y = Math.max(yTopBoundary, topBoundaryPadding + 50 + (Math.random() * 50 - 25)); // Ensure below menu or top padding


            const body = Bodies.rectangle(x, y, width, height, {
                 restitution: 0.3, // Less bouncy
                 friction: 0.05, // Lower friction
                 frictionAir: currentFrictionAir, // Air drag, tunable via the Float Speed slider
                 density: 0.001,
                 isStatic: data.isStatic || data.isSleeping // Default static, or sleeping bubbles are static
            });
            
            body.customWidth = width;
            body.customHeight = height;
            
            bubbleMap.set(body.id, bubble);
            reverseBubbleMap.set(bubble, body.id);
            
            // 6. Add event listeners
            bubble.querySelector('.close-btn').addEventListener('click', () => {
                // Clear any running intervals!
                if (bubble.intervalId) clearInterval(bubble.intervalId);
                
                bubbleResizeObserver.unobserve(bubble); // Stop observing
                bubble.remove(); 
                bubbleMap.delete(body.id); 
                reverseBubbleMap.delete(bubble);
                Composite.remove(matterWorld, body); 
                saveBubblesState(); 
            });
            
            bubble.querySelector('.toggle-animate').addEventListener('change', (e) => {
                const isStatic = !e.target.checked;
                // Cannot animate if sleeping
                if (bubble.isSleeping && !isStatic) {
                     e.target.checked = false; // Prevent checking
                     showNotification("Wake bubble to animate.", "info");
                     return; 
                }
                Body.setStatic(body, isStatic);

                // Store the 'static' state for saving
                const bubbleData = JSON.parse(bubble.dataset.bubbleData);
                bubbleData.isStatic = isStatic;
                bubble.dataset.bubbleData = JSON.stringify(bubbleData);
                saveBubblesState();
            });
            
             // NEW: Sleep/Wake Logic
            const sleepWakeBtn = bubble.querySelector('.sleep-wake-btn');
            sleepWakeBtn.addEventListener('click', () => {
                 bubble.isSleeping = !bubble.isSleeping;
                 bubble.classList.toggle('sleeping');
                 
                 // Sleeping bubbles MUST be static
                 const isNowStatic = bubble.isSleeping || !bubble.querySelector('.toggle-animate').checked;
                 Body.setStatic(body, isNowStatic);

                 // Update button icon/title
                 sleepWakeBtn.title = bubble.isSleeping ? 'Wake Bubble' : 'Sleep Bubble';
                 sleepWakeBtn.innerHTML = bubble.isSleeping ? 
                     '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" /></svg>' : 
                     '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>';

                 // Save sleep state
                 const bubbleData = JSON.parse(bubble.dataset.bubbleData);
                 bubbleData.isSleeping = bubble.isSleeping;
                 // Also save static state as it might have changed
                 bubbleData.isStatic = isNowStatic; 
                 bubble.dataset.bubbleData = JSON.stringify(bubbleData);
                 saveBubblesState();
             });

            
            // 7. Observe for resizing
            bubbleResizeObserver.observe(bubble);

            Composite.add(matterWorld, body);
            return bubble;
        }

        // --- Save/Load State ---
        
        function saveBubblesState() {
            if (isLoadingState) return;
            const bubblesData = [];
            document.querySelectorAll('.bubble').forEach(bubble => {
                if (bubble.dataset.bubbleData) {
                    bubblesData.push(bubble.dataset.bubbleData); // Save the stringified data
                }
            });
            localStorage.setItem('dashboardBubbles', JSON.stringify(bubblesData));
            console.log("Layout Saved!");
        }

        async function loadBubblesState(overrideBubbles, arrangeAfter = true) {
            isLoadingState = true;
             // Clear existing DOM/physics bubbles FIRST, WITHOUT wiping the
             // saved layout in localStorage that this same function is about
             // to read a few lines down (see clearAllBubbles' comment).
             clearAllBubbles(false);

            // Load background first
            const savedBg = localStorage.getItem('dashboardBackground');
            if (savedBg) {
                document.body.style.backgroundImage = `url(${savedBg})`;
                customBgInput.value = savedBg; // Set input value as well
                customBgSelect.value = ""; // Clear preset selection if custom URL exists
            }

            let savedBubbles = overrideBubbles || JSON.parse(localStorage.getItem('dashboardBubbles') || '[]');
            const isFirstEverVisit = !localStorage.getItem('weatherbubbVisited');
            if (!overrideBubbles && savedBubbles.length === 0 && isFirstEverVisit) {
                savedBubbles = getStarterBubbles();
            }
            localStorage.setItem('weatherbubbVisited', '1');

            // FIX: Set zoom slider and currentScale based on saved state, THEN load bubbles.
            // Skipped on mobile: bubble width there always follows the
            // current responsive default (see createAndDisplayBubble),
            // ignoring any saved width -- so inferring a "zoom" by comparing
            // an old saved width against today's (much wider, mobile-sized)
            // BUBBLE_DEFAULT_WIDTH would read as a huge zoom-out that the
            // user never actually chose, and silently shrink every bubble.
            if (savedBubbles.length > 0 && !isMobileViewport) {
                 const avgZoom = savedBubbles.reduce((acc, b) => {
                    const data = JSON.parse(b);
                    // Use a base size to calculate zoom ratio
                    let baseWidth = BUBBLE_DEFAULT_WIDTH;
                     let baseHeight = BUBBLE_DEFAULT_HEIGHT;
                    if (data.type === 'news' || data.type === 'reddit') baseHeight = BUBBLE_NEWS_HEIGHT;
                    if (data.type === 'todo') baseHeight = BUBBLE_TODO_HEIGHT;

                    // Average zoom based on width OR height, whichever is more scaled
                    const widthZoom = (data.width || baseWidth) / baseWidth;
                    const heightZoom = (data.height || baseHeight) / baseHeight;

                    // Ensure zoom isn't calculated from tiny values if somehow saved incorrectly
                     if (isNaN(widthZoom) || isNaN(heightZoom) || widthZoom < 0.1 || heightZoom < 0.1) return acc; 

                    return acc + Math.max(widthZoom, heightZoom); 
                }, 0) / savedBubbles.length;
                
                const clampedAvgZoom = Math.max(0.5, Math.min(1.5, avgZoom || 1)); // Ensure it's not NaN
                zoomSlider.value = clampedAvgZoom;
                currentScale = clampedAvgZoom; // Set initial scale
            }
            
            const loadPromises = savedBubbles.map(bubbleDataString => {
                try {
                    const bubbleData = JSON.parse(bubbleDataString);
                    // Ensure loaded bubbles respect the min size (scaled by current zoom)
                     bubbleData.width = Math.max(BUBBLE_MIN_WIDTH * currentScale, bubbleData.width || BUBBLE_DEFAULT_WIDTH * currentScale);
                     bubbleData.height = Math.max(BUBBLE_MIN_HEIGHT * currentScale, bubbleData.height || BUBBLE_DEFAULT_HEIGHT * currentScale);

                    
                    return createAndDisplayBubble(bubbleData.type, bubbleData)
                        .catch(err => console.error(`Failed to load bubble:`, err));
                } catch (e) {
                    console.error("Failed to parse saved bubble data:", e);
                    return Promise.resolve();
                }
            });
            
            await Promise.all(loadPromises);

            // Apply initial zoom correctly after loading all bubbles
             applyZoom(currentScale);

            isLoadingState = false;

            // Tidy the starter cluster / a loaded preset into a neat row
            // instead of the usual random scatter (skipped for the Chaos
            // preset, which wants bubbles drifting loose from the start).
            if ((isFirstEverVisit || overrideBubbles) && arrangeAfter && savedBubbles.length > 0) {
                arrangeBubbles();
            }
            if (overrideBubbles) saveBubblesState();
        }

        // NEW: Central function to apply zoom
        function applyZoom(newScale) {
            const scaleFactor = newScale / currentScale; // Calculate change factor
            
            // Scale every bubble body and update its DOM
            for (const [bodyId, bubble] of bubbleMap.entries()) {
                const body = Composite.get(matterWorld, bodyId, 'body');
                if (!body) continue;
                
                // Clamp new size to minimums (scaled minimums)
                let newWidth = Math.max(BUBBLE_MIN_WIDTH * newScale, body.customWidth * scaleFactor);
                let newHeight = Math.max(BUBBLE_MIN_HEIGHT * newScale, body.customHeight * scaleFactor);
                
                const finalScaleX = newWidth / body.customWidth;
                const finalScaleY = newHeight / body.customHeight;
                
                 // Update DOM size first
                 bubble.style.width = `${newWidth}px`;
                 bubble.style.height = `${newHeight}px`;

                // Scale the physics body
                Body.scale(body, finalScaleX, finalScaleY);
                 // IMPORTANT: Update position because scaling changes the center
                 Body.setPosition(body, {
                     x: body.position.x * scaleFactor, // Scale position relative to origin
                     y: body.position.y * scaleFactor
                 });
                
                // Update custom size trackers
                body.customWidth = newWidth;
                body.customHeight = newHeight;
                
                
                // Save new size to dataset for persistence
                try {
                    const bubbleData = JSON.parse(bubble.dataset.bubbleData);
                    bubbleData.width = newWidth;
                    bubbleData.height = newHeight;
                    bubble.dataset.bubbleData = JSON.stringify(bubbleData);
                } catch (e) { console.error("Error saving zoom:", e); }
            }
            
            currentScale = newScale; // Update the current scale
            // Don't auto-save here, let user save explicitly
        }
        
        // NEW: Arrange Bubbles Function
        function arrangeBubbles() {
            const bodies = Composite.allBodies(matterWorld).filter(b => bubbleMap.has(b.id)); // Arrange ALL bubbles
            bodies.sort((a, b) => a.id - b.id); // Stable sort

            const padding = 20 * currentScale; // Scale padding
            const containerWidth = contentWidth;
            let x = padding;
             // Use 0 as the top boundary now
             let yTopBoundary = padding; 
            let y = yTopBoundary;
            let rowMaxHeight = 0;

            bodies.forEach(body => {
                const bubble = bubbleMap.get(body.id);
                const bubbleData = JSON.parse(bubble.dataset.bubbleData);
                const w = bubbleData.width;
                const h = bubbleData.height;

                if (x + w + padding > containerWidth) {
                    // Move to next row
                    x = padding;
                    y += rowMaxHeight + padding;
                    rowMaxHeight = 0;
                }
                
                // Set position (center of the body)
                Body.setPosition(body, { x: x + w / 2, y: y + h / 2 });
                Body.setVelocity(body, { x: 0, y: 0 }); // Stop movement
                Body.setAngularVelocity(body, 0); // Stop rotation
                
                x += w + padding;
                if (h > rowMaxHeight) {
                    rowMaxHeight = h;
                }
            });
            showNotification("Bubbles Arranged!", "success");
            saveBubblesState(); // Save the new positions implicitly
        }
        
         // NEW: Clear All Bubbles Function
        // wipeStorage=false just clears the DOM/physics state (used internally
        // by loadBubblesState() to reset before repopulating from a saved
        // layout). This used to always wipe localStorage['dashboardBubbles']
        // unconditionally -- but loadBubblesState() calls this as its very
        // first line, before it reads that same key back, so every page
        // load/reload was silently deleting the saved layout an instant
        // before trying to restore it. Real bubbles never survived a
        // refresh. Only the explicit "Clear All Bubbles" button should wipe
        // the saved layout.
        function clearAllBubbles(wipeStorage = true) {
            // Use bubbleMap for efficient iteration
            for (const [bodyId, bubble] of bubbleMap.entries()) {
                 // Clear any running intervals!
                if (bubble.intervalId) clearInterval(bubble.intervalId);

                bubbleResizeObserver.unobserve(bubble); // Stop observing
                bubble.remove();
                Composite.remove(matterWorld, Composite.get(matterWorld, bodyId, 'body'));
            }
             bubbleMap.clear();
             reverseBubbleMap.clear();
             if (wipeStorage) {
                 localStorage.removeItem('dashboardBubbles'); // Clear saved state
                 showNotification("All bubbles cleared!", "success");
             }
        }

        });
        closeModalBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('visible');
        });
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('visible');
            }
        });
        // This is where you would paste your real link (see DONATION_SETUP.md)
        donateLink.addEventListener('click', (e) => {
            if (donateLink.getAttribute('href') === '#') {
                e.preventDefault();
                showNotification("Donation link not set up!", "error");
                modalOverlay.classList.remove('visible');
            }
        });
        
        window.addEventListener('load', () => {
            // Restore saved theme + float speed before physics/bubbles spin up
            const savedTheme = localStorage.getItem('dashboardTheme') || 'classic';
            themeSelect.value = savedTheme;
            document.body.classList.toggle('theme-bonappel', savedTheme === 'bonappel');

            const savedSpeed = parseFloat(localStorage.getItem('dashboardSpeed'));
            const initialSpeed = isNaN(savedSpeed) ? parseFloat(speedSlider.value) : savedSpeed;
            speedSlider.value = initialSpeed;
            currentFrictionAir = speedToFrictionAir(initialSpeed);

            populateTimezones();
             populateBackgrounds(); // NEW: Populate BG presets
            updateLayoutCSS();
            initPhysics();
            loadBubblesState(); // This now handles setting initial zoom and loading background
            typeSelect.dispatchEvent(new Event('change')); // Show the correct initial input
        });
        
    </script>
</body>
</html>
